name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Python installieren
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Anwendung testen
        run: ./test.sh
